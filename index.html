<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qual Ryan Gosling você é?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="blob blob--pink" aria-hidden="true"></div>
  <div class="blob blob--blue" aria-hidden="true"></div>
  <div class="blob blob--yellow" aria-hidden="true"></div>

  <main class="app">

    <h1>Qual Ryan Gosling você é?</h1>
    <p class="subtitle">Um teste extremamente rigoroso e cientificamente duvidoso pra descobrir sua versão definitiva.</p>

    <div class="progress" id="progress"></div>

    <section class="card" id="quiz-card">
      <p class="card-kicker" id="question-count">Pergunta 1 de 8</p>
      <h2 class="question" id="question-text"></h2>
      <div class="options" id="options"></div>
    </section>

    <section class="card card--result hidden" id="result-card">
      <div class="badge" id="result-badge"></div>
      <h2 class="result-title" id="result-title"></h2>
      <p class="result-desc" id="result-desc"></p>

      <button class="breakdown-toggle" id="breakdown-toggle" type="button">Ver compatibilidade completa</button>
      <div class="breakdown hidden" id="breakdown"></div>

      <button class="restart" id="restart-btn" type="button">Refazer o quiz</button>
    </section>

  </main>

<script src="script.js"></script>
</body>
</html>
